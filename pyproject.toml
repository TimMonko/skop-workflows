[project]
name = "skop-workflows"
version = "0.0.0"
description = "Recordable, replayable, batchable workflows made of ops"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skop_core", "src/skop_visual"]

[dependency-groups]
dev = [
    "pyrefly",
    "ruff",
]
viz = [
    "marimo",
]

[tool.uv]
default-groups = ["dev", "viz"]

[tool.ruff]
line-length = 79
format.quote-style = "single"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "I",    # isort
    "BLE",  # flake8-blind-except
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "ISC",  # flake8-implicit-str-concat
    "G",    # flake8-logging-format
    "PIE",  # flake8-pie
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long; the formatter handles it
    "A003",  # records use `id` deliberately (Run.id, Event.id)
]

[tool.ruff.lint.per-file-ignores]
# A marimo cell displays by ending in a bare expression.
"notebooks/**" = ["B018"]

[tool.pyrefly]
project-includes = ["src/skop_core", "src/skop_visual"]
python-platform = "all"
