[project]
name = "skop-workflows"
version = "0.0.0"
description = "Recordable, replayable, batchable workflows made of ops"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skop_core"]
